<!doctype html><html lang="ko"><meta charset="utf-8"><title>Codex Daily Check browser fixture</title><style>body{font:18px system-ui;max-width:650px;margin:64px auto;padding:24px}input,button{font:inherit;padding:12px}output{display:block;margin-top:24px}</style><h1>Codex 브라우저 기능 점검</h1><p>이 페이지는 로컬 점검용입니다. 외부로 데이터를 보내지 않습니다.</p><label for="token">점검 코드</label> <input id="token" autocomplete="off"><button id="verify" type="button">확인</button><output id="result" aria-live="polite">대기</output><script>document.querySelector('#verify').addEventListener('click',()=>{document.querySelector('#result').textContent='확인: '+document.querySelector('#token').value;});</script></html>
